# ──────────────────────────────────────────────────────────────────────────────
# Mizan CI/CD — Build, Test, and Deploy
#
# On push to main:
#   1. Backend: lint → test → build Docker image → push to registry
#   2. Frontend: install → build → build Docker image → push to registry
#
# On PR:
#   lint + test only (no build/push)
#
# Required secrets (Settings → Secrets and variables → Actions):
#   JWT_SECRET_KEY  — for running integration tests
#   REGISTRY        — e.g. ghcr.io or docker.io
#   REGISTRY_USER   — registry username
#   REGISTRY_PASS   — registry password/token
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ${{ secrets.REGISTRY || 'ghcr.io' }}

jobs:
  # ── Backend: lint + test ──────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mizan_test
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan_test_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://mizan:mizan_test_pwd@localhost:5432/mizan_test
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-secret-key-at-least-32-characters-long' }}
          APP_ENV: development
        run: |
          python -m pytest test_api.py test_auth.py -v

  # ── Frontend: build check ────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Build & Push Docker Images (main branch only) ────────────────────
  build-and-push:
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_PASS || secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/mizan-backend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/mizan-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/mizan-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/mizan-frontend:${{ github.sha }}
