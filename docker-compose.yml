# ──────────────────────────────────────────────────────────────────────────────
# Mizan — Full-Stack Local Development with Docker Compose
#
# Usage:
#   docker compose up              # start all services
#   docker compose up -d           # start detached
#   docker compose down            # stop and remove containers
#
# Services:
#   db       — PostgreSQL 16 (persists to named volume)
#   backend  — FastAPI on :8000 (auto-reload)
#   frontend — Next.js on :3000 (dev server)
#
# Backend API:    http://localhost:8000/api/health
# Frontend:       http://localhost:3000
# ──────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan_dev_pwd
    ports:
      - "5432:5432"
    volumes:
      - mizan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mizan:mizan_dev_pwd@db:5432/mizan
      JWT_SECRET_KEY: dev-secret-key-CHANGE-IN-PRODUCTION-abc123
      APP_ENV: development
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
    volumes:
      - ./backend:/app
      - ./tools:/app/../tools:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mizan_pgdata:
