---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mizan-frontend
  namespace: mizan
  labels:
    app: mizan-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mizan-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mizan-frontend
    spec:
      containers:
        - name: frontend
          image: localhost:30500/mizan-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://mizan.local/api"
            - name: PORT
              value: "3000"
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mizan-frontend
  namespace: mizan
spec:
  selector:
    app: mizan-frontend
  ports:
    - port: 3000
      targetPort: 3000
