---
# Mizan Frontend Deployment — environment-aware
# Dev:  NEXT_PUBLIC_API_URL=http://mizan.local/api
# Prod: NEXT_PUBLIC_API_URL=https://mizan-invest.com/api
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mizan-frontend
  namespace: mizan
  labels:
    app: mizan-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mizan-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mizan-frontend
    spec:
      # Spread replicas across nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mizan-frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: localhost:30500/mizan-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: mizan-frontend-config
                  key: NEXT_PUBLIC_API_URL
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          # ── Security: non-root, no privilege escalation ──
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            failureThreshold: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mizan-frontend-config
  namespace: mizan
data:
  # Dev:  http://mizan.local/api
  # Prod: https://mizan-invest.com/api
  NEXT_PUBLIC_API_URL: "http://mizan.local/api"
---
apiVersion: v1
kind: Service
metadata:
  name: mizan-frontend
  namespace: mizan
spec:
  selector:
    app: mizan-frontend
  ports:
    - port: 3000
      targetPort: 3000
