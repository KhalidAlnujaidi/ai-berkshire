---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mizan-ingress
  namespace: mizan
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: mizan.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mizan-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mizan-frontend
                port:
                  number: 3000
