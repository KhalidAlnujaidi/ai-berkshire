---
# Prometheus monitoring stack for Mizan
#
# Deploy with: kubectl apply -f k8s/monitoring.yaml
#
# This creates:
#   - Namespace: monitoring
#   - ServiceMonitor for the Mizan backend (/metrics endpoint)
#   - A lightweight Prometheus deployment (for clusters without kube-prometheus-stack)
#
# If you already have kube-prometheus-stack installed, just apply the ServiceMonitor
# and skip the Prometheus deployment — it will auto-discover the target.

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: baseline

---
# ServiceMonitor tells Prometheus to scrape /metrics from the backend
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mizan-backend
  namespace: monitoring
  labels:
    release: mizan  # matches kube-prometheus-stack Helm release label
spec:
  selector:
    matchLabels:
      app: mizan-backend
  namespaceSelector:
    matchNames:
      - mizan
  endpoints:
    - port: ""           # uses the first (only) named port on the Service
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      # The backend Service has no named port; target by port number
      port: "8000"
---
# Service for Prometheus (if running standalone, not kube-prometheus-stack)
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: web

---
# Minimal Prometheus deployment (for clusters without kube-prometheus-stack)
# Uses the official Prometheus image with a simple config that scrapes Mizan
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
# Prometheus configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Mizan backend metrics
      - job_name: 'mizan-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['mizan']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: mizan-backend
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8000"
          - target_label: __metrics_path__
            replacement: /metrics

      # Self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
