# Kubernetes Secret for Mizan — COPY this file to postgres-secret.yaml
# and fill in real values. postgres-secret.yaml is gitignored.
#
# Generate a JWT secret: python -c "import secrets; print(secrets.token_hex(32))"
#
# Usage:
#   cp postgres-secret.example.yaml postgres-secret.yaml
#   # Edit postgres-secret.yaml with real secrets
#   kubectl apply -f postgres-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: mizan-secrets
  namespace: mizan
type: Opaque
stringData:
  JWT_SECRET_KEY: "CHANGE-ME-to-a-strong-random-secret"
  POSTGRES_PASSWORD: "CHANGE-ME-to-a-strong-password"
  DATABASE_URL: "postgresql://mizan:CHANGE-ME-PASSWORD@mizan-postgres:5432/mizan"
